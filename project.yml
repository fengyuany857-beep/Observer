name: Observer
options:
  bundleIdPrefix: com.fnauy.observer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  ObserverReadAPI:
    path: Packages/ObserverReadAPI

targets:
  ObserverWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fnauy.observer.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: Generated/ObserverWidgets-Info.plist
      properties:
        CFBundleDisplayName: Observer Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  Observer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Domain
      - path: Sources/Presentation
      - path: Sources/Fixtures
      - path: Sources/SwiftUI
      - path: App
    dependencies:
      - target: ObserverWidgets
        embed: true
      - package: ObserverReadAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fnauy.observer
        PRODUCT_NAME: Observer
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Generated/Observer-Info.plist
      properties:
        CFBundleDisplayName: Observer
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
    scheme:
      gatherCoverageData: false
