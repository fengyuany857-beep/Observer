name: Observer Bootstrap Unpack

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/bootstrap-unpack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify uploaded package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Observer_CI_SelfSign_Pipeline_V1.zip"
          EXPECTED="b45c959005a3731b7f90250aef04120c4af073c49dbf3482f3fa1ee6ceacf536"
          test -f "$ZIP"
          ACTUAL="$(sha256sum "$ZIP" | awk '{print $1}')"
          echo "zip_sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Expand package into repository root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .observer-bootstrap
          mkdir -p .observer-bootstrap
          unzip -q Observer_CI_SelfSign_Pipeline_V1.zip -d .observer-bootstrap
          SRC=".observer-bootstrap/Observer_CI_SelfSign_Pipeline_V1"
          test -f "$SRC/project.yml"
          test -f "$SRC/App/ObserverApp.swift"
          test -f "$SRC/.github/workflows/observer-ci.yml"
          rsync -a             --exclude '.github/'             --exclude '__pycache__/'             --exclude '*.pyc'             "$SRC/" ./
          rm -rf .observer-bootstrap

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App Artifacts Audit Docs Reference Scripts Sources Tests WidgetExtension FILE_MANIFEST.txt README.md project.yml
          if git diff --cached --quiet; then
            echo "No unpack changes to commit."
            exit 0
          fi
          git commit -m "Expand Observer CI Self-Sign Pipeline V1"
          git push origin HEAD:main
